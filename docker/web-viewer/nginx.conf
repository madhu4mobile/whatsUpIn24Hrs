# nginx config for the Daily Global Pulse archive viewer.
#
# Serves two things from a single port:
#   /            → the static index.html (the React-less list/grid viewer)
#   /everything  → the /output dataset as raw static files (mp4, jpg, json)
#
# Mounted in docker-compose.yml as:
#   /usr/share/nginx/html/viewer    ← static viewer
#   /usr/share/nginx/html           ← /output (so mp4s + index.json are served at root)

server {
  listen 80 default_server;
  server_name _;

  # Don't reveal the nginx version
  server_tokens off;

  root /usr/share/nginx/html;
  charset utf-8;

  # Disable caching on the index — we want phones to see new reels
  # immediately rather than a stale list.
  location = /index.json {
    add_header Cache-Control "no-store, must-revalidate" always;
    try_files $uri =404;
  }
  location = /viewer/index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # MP4 + JPG can be cached aggressively (date in the filename = effective version)
  location ~* \.(mp4|m4v|webm|jpg|jpeg|png|webp)$ {
    add_header Cache-Control "public, max-age=3600";
    add_header Accept-Ranges bytes;
    try_files $uri =404;
  }

  # Default page → the viewer
  location = / {
    return 302 /viewer/;
  }

  location /viewer/ {
    try_files $uri $uri/ /viewer/index.html;
  }

  # Disallow directory listings, but DO allow direct file access
  location / {
    autoindex off;
    try_files $uri =404;
  }

  # Useful diagnostic — `curl http://nas:8080/healthz`
  location = /healthz {
    add_header Content-Type "text/plain";
    return 200 "ok\n";
  }
}
