# ─────────────────────────────────────────────────────────────────────────
# Daily Global Pulse — TrueNAS Scale (Goldeye 25.10+) deployment
#
# Two services:
#   builder  — runs the full pipeline once per invocation, then exits.
#              Triggered by a TrueNAS Cron Job at 5:00 AM America/New_York.
#   viewer   — always-on nginx serving the output dataset + a small
#              grid/player UI at http://<nas>:${VIEWER_PORT:-8088}/
#
# Storage layout on the NAS (you create these datasets first):
#   /mnt/<pool>/apps/dailypulse/output     ← MP4s + thumbnails + index.json
#   /mnt/<pool>/apps/dailypulse/content    ← per-day newsContent.json archive
#   /mnt/<pool>/apps/dailypulse/logs       ← per-day run logs
#   /mnt/<pool>/apps/dailypulse/workspace  ← git checkout + node_modules cache
#   /mnt/<pool>/apps/dailypulse/playwright ← chromium binary cache
#
# Make `output` an SMB share AND point Jellyfin at it as a library, and
# you've got file access + media-server playback + the web viewer all
# pointing at the same files.
# ─────────────────────────────────────────────────────────────────────────

services:
  builder:
    image: pulse-builder:latest
    build:
      context: .
      dockerfile: Dockerfile
    # `restart: "no"` is correct — this is a one-shot job, not a service.
    # Cron triggers `docker compose run --rm builder` once per day.
    restart: "no"
    profiles: ["job"]
    environment:
      # ─ Required ──────────────────────────────────────────────────────
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set in the .env or TrueNAS app env}"
      GIT_REPO_URL: "${GIT_REPO_URL:?GIT_REPO_URL must be set (e.g. https://github.com/you/whatsUpIn24Hrs.git)}"
      # ─ Optional ──────────────────────────────────────────────────────
      GIT_BRANCH: "${GIT_BRANCH:-main}"
      RETENTION_DAYS: "${RETENTION_DAYS:-30}"
      SHOW_NAME: "${SHOW_NAME:-Daily Global Pulse}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}"
      TTS_VOICE: "${TTS_VOICE:-en-US-AndrewNeural}"
      TTS_RATE: "${TTS_RATE:--5%}"
      VIDEO_FPS: "${VIDEO_FPS:-30}"
      # Make sure container "today" is NY-local
      TZ: "America/New_York"
    volumes:
      # SMB-shared dataset where finished MP4s + thumbnails land
      - "${OUTPUT_PATH:?OUTPUT_PATH must be set (e.g. /mnt/tank/apps/dailypulse/output)}:/output"
      # Per-day newsContent.json archive — gives you content history and
      # lets the next run fall back to yesterday if the LLM call fails.
      - "${CONTENT_PATH:?CONTENT_PATH must be set (e.g. /mnt/tank/apps/dailypulse/content)}:/content"
      # Per-day run logs
      - "${LOGS_PATH:?LOGS_PATH must be set (e.g. /mnt/tank/apps/dailypulse/logs)}:/logs"
      # Cached git checkout + node_modules (avoids re-downloading every run)
      - "${WORKSPACE_PATH:?WORKSPACE_PATH must be set (e.g. /mnt/tank/apps/dailypulse/workspace)}:/workspace"
      # Cached Playwright Chromium (~150 MB — definitely worth persisting)
      - "${PLAYWRIGHT_PATH:?PLAYWRIGHT_PATH must be set (e.g. /mnt/tank/apps/dailypulse/playwright)}:/opt/playwright"
    # Resource ceilings — Playwright + Chromium is the heavy part. Adjust
    # to your NAS's spec. Defaults are conservative for a Mini/SCALE box.
    deploy:
      resources:
        limits:
          cpus: "${BUILDER_CPUS:-2.0}"
          memory: "${BUILDER_MEMORY:-2g}"

  viewer:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # http://<nas-ip>:8088/  →  the grid viewer
      - "${VIEWER_PORT:-8088}:80"
    volumes:
      # The /output dataset is also served as static files so the
      # viewer can stream MP4s and load thumbnails.
      - "${OUTPUT_PATH:?OUTPUT_PATH must be set}:/usr/share/nginx/html:ro"
      # The static viewer page is overlaid at /viewer/
      - "./docker/web-viewer:/usr/share/nginx/html/viewer:ro"
      # Custom nginx config (range-request friendly, no caching of index.json)
      - "./docker/web-viewer/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    # Tiny health check so TrueNAS Apps shows green
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
