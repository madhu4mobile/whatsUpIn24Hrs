<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Global Pulse — Local Preview</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0a0e1a;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
      }
      header {
        text-align: center;
        padding: 8px 0 16px;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #60a5fa;
      }
      header p {
        margin: 4px 0 0;
        font-size: 12px;
        color: #94a3b8;
      }
      .stage {
        width: 100%;
        max-width: 480px;
        aspect-ratio: 9 / 16;
        background: #000;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      video {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }
      .actions {
        margin-top: 16px;
        display: flex;
        gap: 12px;
        font-size: 13px;
      }
      .actions a {
        color: #60a5fa;
        text-decoration: none;
        padding: 8px 14px;
        border: 1px solid rgba(96, 165, 250, 0.3);
        border-radius: 999px;
      }
      .actions a:active { background: rgba(96, 165, 250, 0.1); }
      footer {
        margin-top: auto;
        padding: 24px 0 8px;
        font-size: 11px;
        color: #475569;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Daily Global Pulse</h1>
      <p>Local preview — not yet published</p>
    </header>

    <div class="stage">
      <video
        controls
        playsinline
        preload="auto"
        src="daily-global-pulse.mp4"
      ></video>
    </div>

    <div class="actions">
      <a href="daily-global-pulse.mp4" download>Download MP4</a>
      <a href="index.html">Browser app</a>
    </div>

    <footer>
      Tap the video to play. If nothing loads, run <code>npm run video</code>
      first to generate <code>dist/daily-global-pulse.mp4</code>.
    </footer>
  </body>
</html>
